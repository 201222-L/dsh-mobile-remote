<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7f9" />
<title>DSH 绉诲姩绔?路 鐣岄潰鍘熷瀷 v6锛圖eepSeek 閰嶈壊锛?/title>
<style>
  /* 鈹€鈹€ DeepSeek 璁捐浠ょ墝锛堝搧鐗岃摑 #426EFE锛?鈹€鈹€ */
  :root {
    --bg: #f6f7f9;            /* 鍐风櫧鐢诲竷 */
    --surface: #ffffff;       /* 鍗＄墖/杈撳叆闈?*/
    --ink: #1f2329;           /* 涓绘枃瀛楋紙钃濋粦锛?*/
    --ink-2: #6b7280;         /* 娆¤ */
    --ink-3: #9ca3af;         /* 鍗犱綅/娉ㄩ噴 */
    --line: #e5e7eb;          /* 缁嗗垎鍓茬嚎锛堝喎鐏帮級 */
    --brand: #426efe;         /* DeepSeek 鍝佺墝钃?*/
    --brand-soft: rgba(66, 110, 254, .1);
    --link: #426efe;          /* 閾炬帴/寮€鍏宠摑 */
    --ok: #3ba55d;
    --danger: #d44c47;
    --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(31,35,41,.05), 0 10px 30px rgba(31,35,41,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #161b22;   /* DeepSeek 娣辫壊锛氭繁钃濋粦 */
      --ink: #e6e8ec; --ink-2: #8b949e; --ink-3: #5c6470;
      --line: #232a33; --brand: #6c8cff; --brand-soft: rgba(108,140,255,.14);
      --link: #6c8cff; --ok: #4cb86f; --danger: #e0655f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  /* 鎵嬪姩娣辫壊妯″紡锛堣缃〉寮€鍏筹級锛氳鐩栬窡闅忕郴缁?*/
  html.force-dark {
    --bg: #0e1116; --surface: #161b22; --ink: #e6e8ec; --ink-2: #8b949e; --ink-3: #5c6470;
    --line: #232a33; --brand: #6c8cff; --brand-soft: rgba(108,140,255,.14);
    --link: #6c8cff; --ok: #4cb86f; --danger: #e0655f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 480px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column;
    overscroll-behavior: none; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .serif { font-family: Georgia, "Playfair Display", "Songti SC", "SimSun", serif; }
  .ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic.sm { width: 16px; height: 16px; }
  .ic.lg { width: 24px; height: 24px; }

  /* 鈹€鈹€ 椤甸潰楠ㄦ灦 鈹€鈹€ */
  .hidden { display: none !important; }
  #stage { flex: auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transform: translateX(14px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; transform: none; }
  main.scroll { flex: auto; min-height: 0; overflow-y: auto; padding: 4px 18px 16px; }
  ::-webkit-scrollbar { width: 0; }

  /* 鈹€鈹€ 椤堕儴瀵艰埅 鈹€鈹€ */
  .topbar { flex: none; display: flex; align-items: center; gap: 6px; padding: calc(14px + env(safe-area-inset-top)) 14px 10px; }
  .topbar .iconbtn { width: 38px; height: 38px; border: none; background: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; }
  .topbar .iconbtn:active { background: var(--line); }
  .topbar .wordmark { font-size: 21px; font-weight: 400; letter-spacing: .01em; }
  .topbar .right { margin-left: auto; display: flex; gap: 2px; }

  /* 鈹€鈹€ 鍝佺墝鏄熷舰 鈹€鈹€ */
  .star { color: var(--brand); }

  /* 鈹€鈹€ 棣栭〉锛氱姸鎬佷腑蹇?鈹€鈹€ */
  .welcome { padding: 14px 2px 10px; }
  .welcome .hi { font-size: 30px; line-height: 1.25; font-weight: 400; letter-spacing: -.01em; }
  .welcome .sub { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.running { background: var(--ok); animation: pulse 1.6s infinite; }
  .dot.waiting { background: var(--brand); }
  .dot.idle { background: var(--ink-3); }
  @keyframes pulse { 50% { opacity: .35; } }

  .card { background: var(--surface); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card .card-h { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 10px; }
  .task { font-size: 16.5px; font-weight: 600; line-height: 1.4; }
  .progress { height: 4px; border-radius: 2px; background: var(--line); margin: 12px 0 10px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 62%; background: var(--brand); border-radius: 2px; }
  .meta { font-size: 13px; color: var(--ink-2); }
  .meta b { color: var(--ink); font-weight: 600; }

  /* 寰呭洖绛旓紙璧ら櫠鑹茶皟锛?*/
  .ask { display: flex; gap: 12px; align-items: flex-start; background: var(--brand-soft); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 12px; }
  .ask .ic { color: var(--brand); margin-top: 1px; }
  .ask .q { font-size: 14.5px; font-weight: 600; line-height: 1.5; }
  .ask .q-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .ask .acts { display: flex; gap: 8px; margin-top: 12px; }
  .ask .acts button { flex: 1; min-height: 42px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-black { background: var(--brand); color: #fff; border: none; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

  .listrow { display: flex; align-items: center; gap: 12px; padding: 11px 2px; }
  .listrow + .listrow { border-top: 1px solid var(--line); }
  .listrow .lead { width: 32px; height: 32px; border-radius: 10px; background: var(--line); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .listrow .t { font-size: 14.5px; }
  .listrow .t small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .listrow .v { margin-left: auto; font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .listrow .v.ok { color: var(--ok); }

  /* 鈹€鈹€ Claude 寮忚緭鍏ュ尯 鈹€鈹€ */
  .composer-wrap { flex: none; padding: 4px 14px calc(12px + env(safe-area-inset-bottom)); }
  .composer {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface); border-radius: 20px;
    padding: 8px 8px 6px 12px; box-shadow: var(--shadow);
  }
  .composer .pillrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .composer .pillrow::-webkit-scrollbar { display: none; }
  .composer .inputrow { display: flex; align-items: center; gap: 8px; }
  .composer .plus {
    width: 34px; height: 34px; border: none; border-radius: 50%; cursor: pointer; flex: none;
    background: var(--line); color: var(--ink); display: inline-flex; align-items: center; justify-content: center;
  }
  .composer .model {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    background: var(--line); color: var(--ink-2); border: none; border-radius: 999px;
    font: inherit; font-size: 11.5px; font-weight: 600; padding: 6px 10px; cursor: pointer;
  }
  .composer .model.on { background: var(--brand); color: #fff; }
  .composer input {
    flex: auto; min-width: 0; border: none; outline: none; background: none;
    color: var(--ink); font: inherit; font-size: 14.5px; padding: 4px 0;
  }
  .composer input::placeholder { color: var(--ink-3); }
  .composer .round {
    width: 36px; height: 36px; border: none; border-radius: 50%; flex: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .composer .mic { background: none; color: var(--ink-2); }
  .composer .send { background: var(--brand); color: #fff; }
  .composer .send:active { transform: scale(.93); }

  /* 鈹€鈹€ 鍔ㄤ綔鍖猴紙鎻掍欢濂戠害锛氱粺涓€ chip 缃戞牸锛?鈹€鈹€ */
  .actions-wrap { flex: none; padding: 2px 14px 6px; }
  .actions-label { font-size: 11px; color: var(--ink-3); padding: 2px 2px 6px; display: flex; align-items: center; gap: 5px; }
  .actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .actions::-webkit-scrollbar { display: none; }
  .actions.hidden { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    box-shadow: var(--shadow);
  }
  .chip:active { background: var(--brand-soft); border-color: var(--brand); }
  .chip .ic { width: 15px; height: 15px; color: var(--brand); }

  /* 鈹€鈹€ 琛ㄥ崟瀛楁锛堝姩浣?bottom sheet 鍐咃級 鈹€鈹€ */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--ink); font: inherit; font-size: 14.5px; padding: 0 12px; outline: none;
  }
  .field input:focus { border-color: var(--brand); }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .form-actions button { flex: 1; min-height: 44px; border-radius: var(--radius-sm); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .form-actions .run { background: var(--brand); color: #fff; border: none; }
  .form-actions .cancel { background: none; color: var(--ink-2); border: 1px solid var(--line); }

  /* 鈹€鈹€ 娑堟伅娴侊紙Claude 鎺掔増锛氭棤姘旀场锛?鈹€鈹€ */
  .msgs { flex: auto; min-height: 0; overflow-y: auto; padding: 10px 18px 6px; }
  .m { margin-bottom: 20px; }
  .m .who { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .m .who .nm { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .m .who .tm { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .m .body { font-size: 15px; line-height: 1.65; }
  .m .body .h { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .m.user { text-align: right; }
  .m.user .who .nm { margin-left: auto; }
  .m.user .who .tm { margin-left: 8px; }
  .m.user .body { display: inline-block; text-align: left; background: var(--surface); border-radius: var(--radius-md); padding: 10px 14px; box-shadow: var(--shadow); }

  details.tool { margin: 12px 0; }
  details.tool summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: 13px; color: var(--ink-2); padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary .nm { color: var(--ink); font-weight: 600; }
  details.tool summary .ok { color: var(--ok); font-size: 12px; margin-left: auto; }
  details.tool summary .arrow { transition: transform .15s; color: var(--ink-3); }
  details.tool[open] summary { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  details.tool[open] summary .arrow { transform: rotate(180deg); }
  details.tool .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; background: var(--surface); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding: 8px 12px 12px; }

  /* 鈹€鈹€ 渚ц竟鏍?鈹€鈹€ */
  #scrim { position: fixed; inset: 0; background: rgba(31,30,29,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; max-width: 480px; margin: 0 auto; }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(78vw, 330px); z-index: 50;
    background: var(--bg); transform: translateX(-102%); transition: transform .24s cubic-bezier(.3,1,.4,1);
    display: flex; flex-direction: column; max-width: 480px;
  }
  #drawer.open { transform: none; box-shadow: 8px 0 40px rgba(0,0,0,.18); }
  .drawer-head { padding: calc(22px + env(safe-area-inset-top)) 22px 14px; }
  .drawer-head .wordmark { font-size: 28px; }
  .drawer-nav { flex: auto; overflow-y: auto; padding: 6px 12px; }
  .drawer-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 12px; border: none; background: none; border-radius: var(--radius-sm);
    font: inherit; font-size: 15px; color: var(--ink-2); cursor: pointer; text-align: left;
  }
  .drawer-item .ic { color: var(--ink-3); }
  .drawer-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .drawer-item.active .ic { color: var(--brand); }
  .drawer-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
  .drawer-foot .name { font-size: 14px; font-weight: 600; }
  .drawer-foot .mail { font-size: 11.5px; color: var(--ink-3); }
  .drawer-foot .gear { margin-left: auto; border: none; background: none; color: var(--ink-2); cursor: pointer; }

  /* 鈹€鈹€ 璁剧疆椤?鈹€鈹€ */
  .center-title { text-align: center; font-size: 24px; padding: 12px 0 16px; }
  .acct-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .acct-card .mail { font-size: 14px; font-weight: 600; }

  .set-group { background: var(--surface); border-radius: var(--radius-md); padding: 4px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; }
  .set-row + .set-row { border-top: 1px solid var(--line); }
  .set-row .ic { color: var(--ink-3); }
  .set-row .t { font-size: 14.5px; }
  .set-row .t small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .set-row .tail { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .set-row .tail .val { font-size: 13px; color: var(--ink-2); }
  .set-row .tail .chev { color: var(--ink-3); }

  .switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .18s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .18s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--link); }
  .switch.on::after { transform: translateX(18px); }

  /* 鈹€鈹€ 搴曢儴寮圭獥 鈹€鈹€ */
  #sheet-mask, #model-mask, #action-mask, #perm-mask, #confirm-mask, #preset-mask, #newsess-mask { position: fixed; inset: 0; background: rgba(31,30,29,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: 480px; margin: 0 auto; }
  #sheet-mask.open, #model-mask.open, #action-mask.open, #perm-mask.open, #confirm-mask.open, #preset-mask.open, #newsess-mask.open { opacity: 1; pointer-events: auto; }
  #sheet, #model-sheet, #action-sheet, #perm-sheet, #confirm-sheet, #preset-sheet, #newsess-sheet {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 102%); width: 100%; max-width: 480px;
    background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    z-index: 70; transition: transform .26s cubic-bezier(.3,1,.4,1);
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
  }
  #sheet.open, #model-sheet.open, #action-sheet.open, #perm-sheet.open, #confirm-sheet.open, #preset-sheet.open, #newsess-sheet.open { transform: translate(-50%, 0); }
  .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet-title { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .attach-grid { display: flex; gap: 10px; margin-bottom: 16px; }
  .attach-grid .cell {
    flex: 1; border: 1px solid var(--line); border-radius: var(--radius-md); background: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0;
    font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer;
  }
  .attach-grid .cell .ic { color: var(--ink); }
  .sheet-row { display: flex; align-items: center; gap: 10px; padding: 13px 2px; font-size: 14.5px; }
  .sheet-row + .sheet-row { border-top: 1px solid var(--line); }
  .sheet-row .tail { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .sheet-row .tail .chev { color: var(--ink-3); }

  /* 妯″瀷閫夋嫨 */
  .model-item { display: flex; align-items: center; gap: 10px; padding: 12px 4px; cursor: pointer; border-radius: var(--radius-sm); }
  .model-item + .model-item { border-top: 1px solid var(--line); }
  .model-item .mn { font-size: 14.5px; font-weight: 600; }
  .model-item .mid { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .model-item .check { margin-left: auto; color: var(--brand); font-weight: 700; font-size: 16px; }
  .effort-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .effort {
    flex: 1; min-height: 38px; border: 1px solid var(--line); border-radius: 999px; background: none;
    font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
  }
  .effort.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

  /* 閫氱煡 */
  .bell-badge {
    position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; border-radius: 999px;
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; padding: 0 4px;
  }
  .notif-item { display: flex; gap: 12px; padding: 13px 16px; cursor: pointer; align-items: flex-start; position: relative; }
  .notif-item + .notif-item { border-top: 1px solid var(--line); }
  .notif-item .lead { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .notif-item .t { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
  .notif-item .d { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.5; }
  .notif-item .tm { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .notif-item .u { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--link); flex: none; margin-top: 5px; }
  .notif-item:not([data-unread]) .u { display: none; }
  .notif-item[data-unread] { background: var(--brand-soft); }

  .proto-note { text-align: center; font-size: 11px; color: var(--ink-3); padding: 10px 16px 2px; }
</style>
</head>
<body>

<!-- 鈺愨晲鈺?鍥炬爣搴擄紙1.5 绾垮锛?鈺愨晲鈺?-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></symbol>

<script>
  // 鈹€鈹€ 瀵艰埅鏍堬細璇︽儏椤靛帇鏍堬紝杩斿洖閫愬眰鍥為€€ 鈹€鈹€

  // 鈹€鈹€ 閫氱煡涓績 鈹€鈹€

    pushScreen('chat');
  }
  function readAllNotifs() {
    document.querySelectorAll("#notif-list .notif-item").forEach((el) => {
      el.removeAttribute("data-unread");
    });

  }

  }
  function sendMsg() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();

    const box = document.getElementById("msgs");
    const d = new Date();
    const tm = d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");

  }

  }
  const DEMO_ACTIONS = [
    { id: "fs-cleanup", title: "娓呯悊纾佺洏", icon: "trash", fields: [ { key: "target", label: "鐩爣鐩綍", placeholder: "濡?F:\\璧勬枡" } ] },
    { id: "test-run", title: "璺戞祴璇?, icon: "zap", fields: [] },
  ];
  function renderActions() {
    const box = document.getElementById("chat-actions");
    box.replaceChildren();
    // 鎻掍欢鏈敞鍐屼换浣曞姩浣?鈫?鏁村尯闅愯棌锛堢┖鎬侊級
    if (DEMO_ACTIONS.length === 0) {
      document.querySelector(".actions-wrap").classList.add("hidden");
      return;
    }
    document.querySelector(".actions-wrap").classList.remove("hidden");
    for (const a of DEMO_ACTIONS) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.innerHTML = '<svg class="ic"><use href="#i-' + a.icon + '"/></svg>' + escapeHtml(a.title);
      chip.onclick = () => openActionSheet(a);
      box.appendChild(chip);
    }
  }
  function openActionSheet(action) {
    document.getElementById("action-title").textContent = action.title;
    const fields = document.getElementById("action-fields");
    fields.replaceChildren();
    if (action.fields.length === 0) {
      const p = document.createElement("p");
      p.style.cssText = "font-size:13px;color:var(--ink-2);text-align:center;padding:8px 0 14px";
      p.textContent = "鐩存帴鎵ц锛屾棤闇€鍙傛暟";
      fields.appendChild(p);
    }
    for (const f of action.fields) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const label = document.createElement("label");
      label.textContent = f.label;
      const input = document.createElement("input");
      input.placeholder = f.placeholder || "";
      input.dataset.key = f.key;
      wrap.appendChild(label);
      wrap.appendChild(input);
      fields.appendChild(wrap);
    }
    document.getElementById("action-sheet").dataset.actionId = action.id;
    document.getElementById("action-sheet").classList.add("open");
    document.getElementById("action-mask").classList.add("open");
  }
  function closeActionSheet() {
    document.getElementById("action-sheet").classList.remove("open");
    document.getElementById("action-mask").classList.remove("open");
  }
  function runAction() {
    const id = document.getElementById("action-sheet").dataset.actionId;
    const action = DEMO_ACTIONS.find((a) => a.id === id);
    closeActionSheet();
    toast("宸插彂閫佺粰 agent锛? + (action ? action.title : id));
    // 妯℃嫙锛氱粨鏋滃洖娑堟伅娴侊紙宸ュ叿琛岋級
    const box = document.getElementById("msgs");
    const t = document.createElement("details");
    t.className = "tool";
    t.open = true;
    t.innerHTML = '<summary><svg class="ic sm"><use href="#i-zap"/></svg><span class="nm">' + escapeHtml(action ? action.title : id) + '</span><span class="ok">宸叉墽琛?/span><svg class="ic sm arrow"><use href="#i-chevron-down"/></svg></summary><div class="body">锛堝師鍨嬫紨绀猴級鍔ㄤ綔宸茬敱 PC 绔彃浠舵墽琛岋紝缁撴灉灏嗗湪杩欓噷鍥炴祦銆?/div>';
    box.appendChild(t);
    box.scrollTop = box.scrollHeight;
  }
  renderActions();
</script>
</body>
</html>
