name: Prepare and publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
      publish:
        description: Publish verified artifacts (otherwise prepare only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      OFFICIAL_NPM_SCOPE: ${{ vars.OFFICIAL_NPM_SCOPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test && npm run check
      - working-directory: dsh-mobile-app
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test
      - name: Configure existing official Android signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci-signing.py
      - name: Build signed APK and run native tests
        env:
          ORG_GRADLE_PROJECT_officialRelease: 'true'
        working-directory: dsh-mobile-app
        run: |
          flutter build apk --release
          cd android
          bash gradlew :app:testDebugUnitTest
      - name: Verify APK identity and prepare signed release manifest
        env:
          RELEASE_SIGNING_SEED: ${{ secrets.RELEASE_SIGNING_SEED }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID || 'dsh-release-2026' }}
        run: python3 tools/prepare-release.py "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ env.TAG }}
          path: release-dist/
          if-no-files-found: error
      - name: Refuse overwriting an existing release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; publish a new version instead.'
            exit 1
          fi
      - name: Publish npm carrier then plugin with OIDC
        if: (github.event_name == 'push' || inputs.publish) && env.OFFICIAL_NPM_SCOPE != ''
        run: |
          node tools/prepare-npm.mjs release-dist npm-dist
          node tools/publish-npm.mjs npm-dist
      - name: Publish GitHub artifacts
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" release-dist/* --verify-tag --title "DSH Remote $TAG" --generate-notes "${FLAGS[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f dsh-mobile-app/android/key.properties dsh-mobile-app/android/ci-release.jks
